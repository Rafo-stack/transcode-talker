# Improvements scoped against the v0.3.5 UI rebuild.

- id: I-201
  title: Full UI rewrite with React + Vite + Tailwind
  status: done
  priority: High
  area: frontend
  targeted_version: "0.3.5.0"
  summary: >
    Replace the single ~2300-line static/index.html (Babel-in-browser, no
    build) with a proper Vite-built React + Tailwind app served by nginx.
  plain_summary: |
    The whole UI you're using right now is the new one. The previous
    interface was a single 2300-line HTML file that loaded React through a
    browser polyfill and compiled JSX on the fly — slow boot, no type
    safety, hard to refactor. The new version is a TypeScript app served as
    a static bundle.
  details: |
    - New folder: `frontend/` (React 18, TypeScript, Vite 6, Tailwind 3).
    - New service: `reencoder-web` (nginx) in `docker-compose.yml`.
    - Tokenized theme via CSS custom properties (`--bg`, `--fg`, `--accent`).
    - Sidebar layout with persistent collapse + submenus.

- id: I-202
  title: Persistent collapsible sidebar with submenu groups
  status: done
  priority: High
  area: frontend
  targeted_version: "0.3.5.0"
  summary: >
    Replace the top-tab nav with a vertical sidebar that supports nested
    children (Settings → General/Encoding/Customize/Storage/Database/Roadmap)
    and remembers its collapse state.
  plain_summary: |
    Settings used to be a single flat page that scrolled forever. Now each
    setting category has its own page under Settings in the sidebar, and
    your collapse preference is saved between sessions.
  details: |
    `frontend/src/components/layout/AppLayout.tsx`. State persisted to
    localStorage under `reenc.sidebar.collapsed` and `reenc.sidebar.submenu.*`.

- id: I-203
  title: Admin Logs page with SSE stream and time-window filters
  status: done
  priority: Medium
  area: backend
  targeted_version: "0.3.5.0"
  summary: >
    Server-side ring buffer of structured log entries exposed via
    `/api/admin/logs/recent` (back-fill) + `/api/admin/logs/stream` (SSE).
  plain_summary: |
    Until now, debugging the worker meant running `docker logs` in a

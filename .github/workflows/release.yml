name: Release Docker Images

# Builds and pushes the 3 service images to GitHub Container Registry (ghcr.io)
# whenever a version tag is pushed.
#
# Tag format: v<MAJOR>.<MINOR>.<PATCH>.<HOTFIX>  e.g.  v0.3.5.2
#
# Images published:
#   ghcr.io/<owner>/reencoder-api:<version>     + :latest
#   ghcr.io/<owner>/reencoder-worker:<version>  + :latest
#   ghcr.io/<owner>/reencoder-web:<version>     + :latest
#
# Users then run the stack via docker-compose.prod.yml without cloning the repo.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override tag (defaults to commit sha-7)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # API build context is the repo root so the Dockerfile can COPY
          # both ./reencoder-api/ and ./roadmap/ into the image.
          - service: reencoder-api
            context: .
            dockerfile: ./reencoder-api/Dockerfile
          - service: reencoder-worker
            context: ./reencoder-worker
            dockerfile: ./reencoder-worker/Dockerfile
          - service: reencoder-web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repo owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve version tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Uses the runner's pre-installed Docker CLI + buildx instead of the
      # `docker/*` GitHub Actions. Those actions started failing with
      # "codeload.github.com 404" for their pinned SHAs on the runner side
      # (the same SHAs serve fine outside the Actions network). Bypassing the
      # actions entirely sidesteps the issue and removes 3 dependencies.

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.service }}
        env:
          IMG_BASE: ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.service }}
          VERSION:  ${{ steps.meta.outputs.version }}
          CONTEXT:  ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          docker buildx create --use --name release-builder --driver docker-container || docker buildx use release-builder
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --file "$DOCKERFILE" \
            --tag "$IMG_BASE:$VERSION" \
            --tag "$IMG_BASE:latest" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            "$CONTEXT"

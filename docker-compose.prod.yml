# Production compose file — pulls pre-built images from GitHub Container Registry.
# Use this if you want to run the app without cloning the source.
#
#   curl -O https://raw.githubusercontent.com/Rafo-stack/transcode-talker/main/docker-compose.prod.yml
#   docker compose -f docker-compose.prod.yml up -d
#
# To pin a specific version, replace ":latest" below with ":0.3.5.1" (etc).
#
# Required host paths (create them or change the volume mappings):
#   /mnt/media   /mnt/animes   /mnt/hdd

services:
  postgres:
    image: postgres:16-alpine
    container_name: reencoder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-reencoder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reencoder}
      POSTGRES_DB:       ${POSTGRES_DB:-reencoder}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-reencoder} -d $${POSTGRES_DB:-reencoder}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - reencoder-net

  reencoder-api:
    image: ghcr.io/rafo-stack/reencoder-api:latest
    container_name: reencoder-api
    restart: unless-stopped
    expose:
      - "4246"
    volumes:
      - ./data:/data
      - /mnt/animes:/mnt/animes
      - /mnt/media:/mnt/media
      - /mnt/hdd:/mnt/hdd
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-America/New_York}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
      - DB_BACKEND=${DB_BACKEND:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-reencoder}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-reencoder}
      - POSTGRES_DB=${POSTGRES_DB:-reencoder}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4246/api/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - reencoder-net

  reencoder-worker:
    image: ghcr.io/rafo-stack/reencoder-worker:latest
    container_name: reencoder-worker
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data:/data
      - /mnt/animes:/mnt/animes
      - /mnt/media:/mnt/media
      - /mnt/hdd:/mnt/hdd
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-America/New_York}
      - DB_BACKEND=${DB_BACKEND:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-reencoder}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-reencoder}
      - POSTGRES_DB=${POSTGRES_DB:-reencoder}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.worker_heartbeat && test $(( $(date +%s) - $(stat -c %Y /data/.worker_heartbeat) )) -lt 30"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - reencoder-net
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G

  reencoder-web:
    image: ghcr.io/rafo-stack/reencoder-web:latest
    container_name: reencoder-web
    restart: unless-stopped
    ports:
      - "4246:80"
    depends_on:
      reencoder-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reencoder-net

networks:
  reencoder-net:
    driver: bridge

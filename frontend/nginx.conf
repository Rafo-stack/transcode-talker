server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any non-asset, non-API path serves index.html so the
    # React Router handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets — long cache lifetime.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # REST API reverse-proxied to the FastAPI container on the docker network.
    # SSE streams need response buffering disabled.
    location /api/ {
        proxy_pass http://reencoder-api:4246;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # WebSocket — same upstream, with Upgrade headers.
    location /ws {
        proxy_pass http://reencoder-api:4246/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
